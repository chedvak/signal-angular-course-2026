<div class="task-container">
  <div class="task-header">
    <h2>{{userName()}}'s Tasks</h2>
    <button class="add-task-btn">Add Tasks</button>
  </div>

  <div class="task-list">
    <ul>
      @for(t of usertasks(); track t.id) {
        <li>
          <app-task [task]="t"></app-task>
        </li>
      }
    </ul>
  </div>
</div>
